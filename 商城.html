<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title></title>
		<link rel="stylesheet" type="text/css" href="css/商城.css">
	</head>
			<body>
				<script>
					window.onload = function() {

						// 商品信息
						var aData = [{
								"imgUrl": "img/新碟上架1.jpg",
								"proName": " Lowlife Princess: Noi ",
								"proPrice": "229",
								"proComm": "1"
							},
							{
								"imgUrl": "img/新碟上架2.jpg",
								"proName": " Thriller 40 ",
								"proPrice": "99.9",
								"proComm": "9.7"
							},
							{
								"imgUrl": "img/新碟上架3.jpg",
								"proName": " w1thout you ",
								"proPrice": "65",
								"proComm": "1.3"
							},
							{
								"imgUrl": "img/新碟上架4.jpg",
								"proName": " Anti-Hero (Acoustic Version) ",
								"proPrice": "149",
								"proComm": "1.1"
							},
							{
								"imgUrl": "img/新碟上架5.jpg",
								"proName": "I Hate You When You're Drunk  ",
								"proPrice": "750",
								"proComm": "0.3"
							},
							{
								"imgUrl": "img/新碟上架6.jpg",
								"proName": " Poison  ",
								"proPrice": "199",
								"proComm": "3.3"
							},
							{
								"imgUrl": "img/新碟上架7.jpg",
								"proName": " break up with that guy",
								"proPrice": "19.9",
								"proComm": "1.2"
							},
							{
								"imgUrl": "img/新碟上架8.jpg",
								"proName": "  Maestro ",
								"proPrice": "45",
								"proComm": "0.6"
							},
							{
								"imgUrl": "img/新碟上架9.jpg",
								"proName": "  I Wish  ",
								"proPrice": "207",
								"proComm": "0.3"
							},
							{
								"imgUrl": "img/新碟上架10.jpg",
								"proName": " Journey (Take Me Where You Wanna) ",
								"proPrice": "199",
								"proComm": "7.2"
							}
						];
						var oBox = document.getElementById("box");
						var oCar = document.getElementById("car");
						var oUl = document.getElementsByTagName("ul")[0];
		
						for (var i = 0; i < aData.length; i++) {
							var oLi = document.createElement("li");
							var data = aData[i];
		
							oLi.innerHTML += '<div class="pro_img"><img src="' + data["imgUrl"] + '" width="150" height="150"></div>';
							oLi.innerHTML += '<h3 id="h3" class="pro_name"><a rel="nofollow" href="#">' + data["proName"] + '</a></h3>';
							oLi.innerHTML += '<p class="pro_price">' + data["proPrice"] + '元</p>';
							oLi.innerHTML += '<p class="pro_rank">' + data["proComm"] + '万人购买</p>';
							oLi.innerHTML += '<div class="add_btn">加入购物车</div>';
							oUl.appendChild(oLi);
		
						}
						var aBtn = getClass(oBox, "add_btn");//获取box下的所有添加购物车按钮
						var number = 0;//初始化商品数量
						for (var i = 0; i < aBtn.length; i++) {
							number++;
							aBtn[i].index = i;
							aBtn[i].onclick = function() {
								var oDiv = document.createElement("div");
								var data = aData[this.index];
								oDiv.className = "row hid";
								oDiv.innerHTML += '<div class="check left"> <i class="i_check" id="i_check" onclick="i_check()" >√</i></div>';
								oDiv.innerHTML += '<div class="img left"><img src="' + data["imgUrl"] + '" width="80" height="80"></div>';
								oDiv.innerHTML += '<div class="name left"><span>' + data["proName"] + '</span></div>';
								oDiv.innerHTML += '<div class="price left"><span>' + data["proPrice"] + '元</span></div>';
								oDiv.innerHTML +=' <div class="item_count_i"><div class="num_count"><div class="count_d">-</div><div class="c_num">1</div><div class="count_i">+</div></div> </div>'
								oDiv.innerHTML += '<div class="subtotal left"><span>' + data["proPrice"] + '元</span></div>'
								oDiv.innerHTML += '<div class="ctrl left"><a rel="nofollow" href="javascript:;">×</a></div>';
								oCar.appendChild(oDiv);
								var flag = true;
								var check = oDiv.firstChild.getElementsByTagName("i")[0];
								check.onclick = function() {
									// console.log(check.className);
									if (check.className == "i_check i_acity") {
										check.classList.remove("i_acity");
		
									} else {
										check.classList.add("i_acity");
									}
									getAmount();
								}
								var delBtn = oDiv.lastChild.getElementsByTagName("a")[0];
								delBtn.onclick = function() {
									var result = confirm("确定删除吗?");
									if (result) {
										oCar.removeChild(oDiv);
										number--;
										getAmount();
									}
								}
								var i_btn = document.getElementsByClassName("count_i");
								for (var k = 0; k < i_btn.length; k++) {
									i_btn[k].onclick = function() {
										bt = this;
										//获取小计节点
										at = this.parentElement.parentElement.nextElementSibling;
										//获取单价节点
										pt = this.parentElement.parentElement.previousElementSibling;
										//获取数量值
										node = bt.parentNode.childNodes[1];
										console.log(node);
										num = node.innerText;
										num = parseInt(num);
										num++;
										node.innerText = num;
										//获取单价
										price = pt.innerText;
										price = price.substring(0, price.length - 1);
										//计算小计值
										at.innerText = price * num + "元";
										//计算总计值
										getAmount();
									}
								}
								获取所有的数量减号按钮
								var d_btn = document.getElementsByClassName("count_d");
								for (k = 0; k < i_btn.length; k++) {
									d_btn[k].onclick = function() {
										bt = this;
										//获取小计节点
										at = this.parentElement.parentElement.nextElementSibling;
										//获取单价节点
										pt = this.parentElement.parentElement.previousElementSibling;
										//获取c_num节点
										node = bt.parentNode.childNodes[1];
										num = node.innerText;
										num = parseInt(num);
										if (num > 1) {
											num--;
										}
										node.innerText = num;
										//获取单价
										price = pt.innerText;
										price = price.substring(0, price.length - 1);
										//计算小计值		
										at.innerText = price * num + "元";
										//计算总计值
										getAmount();
									}
								}
		
								delBtn.onclick = function() {
									var result = confirm("确定删除吗?");
									if (result) {
										oCar.removeChild(oDiv);
										number--;
										getAmount();
									}
								}
		
							}
						}
		
					}
		
					function getClass(oBox, tagname) {
						var aTag = oBox.getElementsByTagName("*");
						var aBox = [];
						for (var i = 0; i < aTag.length; i++) {
							if (aTag[i].className == tagname) {
								aBox.push(aTag[i]);
							}
						}
						return aBox;
					}
		
					// 全选
					var index = false;
					function checkAll() {
						var choose = document.getElementById("car").getElementsByTagName("i");
						// console.log(choose);
						if (choose.length != 1) {
							for (i = 1; i < choose.length; i++) {
								if (!index) {
									choose[0].classList.add("i_acity2")
									choose[i].classList.add("i_acity");
								} else {
									choose[i].classList.remove("i_acity");
									choose[0].classList.remove("i_acity2")
								}
							}
							index = !index;
						}
						getAmount();
					}
		
					//进行价格合计
					function getAmount() {
						// console.log(ys);
						ns = document.getElementsByClassName("i_acity");
						console.log(ns);
						sum = 0;
						//选中框
						document.getElementById("price_num").innerText = sum;
						for (y = 0; y < ns.length; y++) {
							//小计
							amount_info = ns[y].parentElement.parentElement.lastElementChild.previousElementSibling;
							num = parseInt(amount_info.innerText);
							sum += num;
							document.getElementById("price_num").innerText = sum;
						}
					}
				</script>

				</head>
				<body>
					<div id="head">
						<div class="content">
							<div class="left">网易商城欢迎您！</div>
							<div class="lj"><a href="主页.html"> <返回主页</a></div>
							<div style="clear:both"></div>
						</div>
					</div>
					
					<div id="car" class="car">
		
						<div class="head_row hid">
							<div class="check left"> <i onclick="checkAll()">√</i></div>
							<div class="img left">  全选</div>
							<div class="name left">商品名称</div>
							<div class="price left">单价</div>
							<div class="number left">数量</div>
							<div class="subtotal left">小计</div>
							<div class="ctrl left">操作</div>
						</div>
		
					</div>
					<div id="sum_area">
						<div id="pay" a><a href="订单页面.html">去结算</a></div>
						<div id="pay_amout">合计：<span id="price_num">0</span>元</div>
					</div>
		
					<div id="box">
						<h2 id="h5" class="box_head"><span>歌单专辑购买</span></h2>
						<ul>
						</ul>
